services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - webhook_gateway_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d webhook_gateway']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webhook_gateway_pg:
